<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, #1a1a1a 0%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .mark {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: #000000;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.08), 0 8px 30px rgba(0,0,0,0.5);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .mark span {
    color: #ffffff;
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -2px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .title {
    color: #f2f2f2;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    border-radius: 50%;
    background: #ffffff;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span>X</span></div>
    <div class="title">Loading Xorcist</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
